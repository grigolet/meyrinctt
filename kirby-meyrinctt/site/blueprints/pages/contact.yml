# Contact page blueprint
title: Contact
icon: 📧

tabs:
  content:
    label: Contenu
    icon: text
    columns:
      - width: 2/3
        sections:
          hero:
            type: fields
            fields:
              hero_title:
                type: text
                label: Titre de la page
                default: "Contact"
                
              hero_subtitle:
                type: text
                label: Sous-titre
                default: "Une question ? Envie de nous rejoindre ?"
                
          form:
            type: fields
            fields:
              form_title:
                type: text
                label: Titre du formulaire
                default: "Envoyez un message"
                
              success_message:
                type: textarea
                label: Message de confirmation
                default: "Votre message a été envoyé avec succès ! Nous vous répondrons dans les plus brefs délais."
                
      - width: 1/3
        sections:
          info_section:
            type: fields
            fields:
              info_title:
                type: text
                label: Titre section coordonnées
                default: "Coordonnées"

  map:
    label: Carte
    icon: map
    fields:
      map_headline:
        type: headline
        label: Localisation
        
      map_embed:
        type: textarea
        label: Code embed Google Maps
        help: Collez le code iframe de Google Maps ici
        
      directions:
        type: textarea
        label: Indications d'accès
        help: Instructions pour trouver le club
