# Article page blueprint
title: Article
icon: 📄

tabs:
  content:
    label: Contenu
    icon: text
    columns:
      - width: 2/3
        sections:
          meta:
            type: fields
            fields:
              date:
                type: date
                label: Date de publication
                default: today
                width: 1/2
                
              author:
                type: text
                label: Auteur
                width: 1/2
                
          content:
            type: fields
            fields:
              excerpt:
                type: textarea
                label: Extrait
                help: Court résumé affiché dans les listes
                maxlength: 200
                
              text:
                type: blocks
                label: Contenu de l'article
                fieldsets:
                  - heading
                  - text
                  - list
                  - quote
                  - image
                  - gallery
                  - video
                  - code
                  - markdown
                  - file
                  
      - width: 1/3
        sections:
          cover:
            type: files
            label: Image de couverture
            layout: cards
            max: 1
            template: cover
            
          files:
            type: files
            label: Fichiers attachés
            layout: list
