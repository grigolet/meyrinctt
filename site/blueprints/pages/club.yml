# Club page blueprint
title: Le Club
icon: 👥

tabs:
  content:
    label: Contenu
    icon: text
    columns:
      - width: 2/3
        sections:
          hero:
            type: fields
            fields:
              hero_title:
                type: text
                label: Titre de la page
                default: "Le Club"
                
              hero_subtitle:
                type: text
                label: Sous-titre
                default: "Découvrez l'équipe du Meyrin CTT."
                
          stats:
            type: fields
            fields:
              stats_headline:
                type: headline
                label: Statistiques du club
                
              stat_members:
                type: number
                label: Nombre de membres
                default: 160
                
              stat_licensed:
                type: number
                label: Joueurs licenciés
                default: 60
                
              stat_min_age:
                type: number
                label: Âge minimum école jeunesse
                default: 6
                
          about:
            type: fields
            fields:
              about_headline:
                type: headline
                label: À propos du club
                
              about_text:
                type: blocks
                label: Présentation du club
                fieldsets:
                  - heading
                  - text
                  - list
                  - quote

          ttstats:
            type: fields
            fields:
              ttstats_headline:
                type: headline
                label: Widget TTStats

              ttstats_enabled:
                type: toggle
                label: Afficher le widget TTStats
                default: true
                width: 1/2

              ttstats_title:
                type: text
                label: Titre de la section
                default: "Résultats TTStats"
                width: 1/2

              ttstats_url:
                type: url
                label: URL du widget
                default: "https://ttstats.ch/widget/33165?theme=light&lang=fr"

              ttstats_height:
                type: number
                label: Hauteur du widget (px)
                default: 700
                min: 400
                max: 1200
                step: 50
                width: 1/2

              ttstats_iframe_title:
                type: text
                label: Titre accessible de l'iframe
                default: "TTStats Club Widget"
                width: 1/2
                  
      - width: 1/3
        sections:
          hero_image:
            type: fields
            fields:
              hero_image:
                type: files
                label: Image Hero
                max: 1
                layout: cards
                query: page.images
                uploads:
                  template: hero

          files:
            type: files
            label: Images
            layout: cards

  carousel:
    label: Carrousel Photos
    icon: images
    columns:
      - width: 2/3
        sections:
          carousel_settings:
            type: fields
            fields:
              carousel_title:
                type: text
                label: Titre de la section carrousel
                default: "Notre Club en Images"
                
              carousel_subtitle:
                type: textarea
                label: Sous-titre/Description (optionnel)
                maxlength: 200
                
              carousel_autoplay:
                type: toggle
                label: Défilement automatique
                default: true
                help: Active le défilement automatique des images
                
              carousel_delay:
                type: number
                label: Délai de défilement (ms)
                default: 5000
                min: 2000
                max: 10000
                step: 500
                help: Temps d'affichage de chaque image en millisecondes
                
      - width: 1/3
        sections:
          carousel_images:
            type: files
            label: Photos du carrousel
            layout: cards
            template: carousel-image
            help: Ajoutez des photos qui seront affichées dans le carrousel avant l'histoire du club

  history:
    label: Histoire
    icon: clock
    fields:
      history_title:
        type: text
        label: Titre section histoire
        default: "Histoire du Club"
        
      history_timeline:
        type: structure
        label: Chronologie
        fields:
          year:
            type: text
            label: Année/Période
            width: 1/4
          title:
            type: text
            label: Titre
            width: 3/4
          description:
            type: textarea
            label: Description

  statutes:
    label: Statuts
    icon: document
    fields:
      statutes_title:
        type: text
        label: Titre de la section
        default: "Statuts du Club"

      statutes_document_title:
        type: text
        label: Titre du document
        default: "Statuts du Meyrin CTT"
        width: 1/2

      statutes_button_label:
        type: text
        label: Texte du bouton
        default: "Télécharger les statuts"
        width: 1/2

      statutes_description:
        type: textarea
        label: Description
        default: "Consultez les statuts officiels qui définissent l'organisation et le fonctionnement du club."
        buttons:
          - bold
          - italic
          - link

      statutes_pdf:
        type: files
        label: Fichier PDF des statuts
        max: 1
        layout: cards
        query: page.files.filterBy("extension", "pdf")
        uploads:
          template: document
        help: Si aucun fichier n'est sélectionné, le document Statuts_Meyrin_CTT.pdf existant sera utilisé.

  committee:
    label: Comité
    icon: users
    fields:
      committee_title:
        type: text
        label: Titre section comité
        default: "Le Comité"
        
      committee_members:
        type: structure
        label: Membres du comité
        fields:
          photo:
            type: files
            label: Photo de profil
            max: 1
            layout: cards
            query: page.images
            width: 1/2
          role:
            type: text
            label: Rôle
            width: 1/2
          name:
            type: text
            label: Nom
            width: 1/2
          email:
            type: email
            label: Email
            width: 1/2

      technical_advisors_title:
        type: text
        label: Titre section conseillers
        default: "Conseiller technique"

      technical_advisors_intro:
        type: textarea
        label: Introduction conseillers
        default: "Participe aux séances du comité à titre consultatif, sans être membre statutaire du comité."
        buttons:
          - bold
          - italic
          - link

      technical_advisors:
        type: structure
        label: Conseillers techniques
        fields:
          photo:
            type: files
            label: Photo de profil
            max: 1
            layout: cards
            query: page.images
            width: 1/2
          role:
            type: text
            label: Rôle
            default: "Conseiller technique"
            width: 1/2
          name:
            type: text
            label: Nom
            width: 1/2
          email:
            type: email
            label: Email
            width: 1/2
          description:
            type: textarea
            label: Description courte
            buttons:
              - bold
              - italic
              - link

  honorary_president:
    label: Présidente d'honneur
    icon: user
    fields:
      honorary_president_title:
        type: text
        label: Titre section présidente d'honneur
        default: "Présidente d'honneur"

      honorary_president_photo:
        type: files
        label: Photo
        max: 1
        layout: cards
        query: page.images
        width: 1/2

      honorary_president_name:
        type: text
        label: Nom
        width: 1/2

      honorary_president_description:
        type: textarea
        label: Courte description
        buttons:
          - bold
          - italic
          - link

  achievements:
    label: Palmarès
    icon: trophy
    fields:
      achievements_title:
        type: text
        label: Titre section palmarès
        default: "Palmarès du Club"

      achievements_image:
        type: files
        label: Image ou trophée
        max: 1
        layout: cards
        query: page.images
        help: Optionnel. Si aucune image n'est choisie, une icône trophée sera affichée.

      achievements_intro:
        type: textarea
        label: Texte d'introduction
        buttons:
          - bold
          - italic
          - link

      club_achievements:
        type: structure
        label: Trophées et accomplissements
        fields:
          number:
            type: text
            label: Nombre
            width: 1/4
            placeholder: "3"
          label:
            type: text
            label: Accomplissement
            width: 3/4
            placeholder: "Champions suisses LNB Hommes"
          description:
            type: textarea
            label: Détail optionnel
            buttons:
              - bold
              - italic
              - link

  coaches:
    label: Entraîneurs
    icon: account
    fields:
      coaches_title:
        type: text
        label: Titre section entraîneurs
        default: "Nos Entraîneurs"
        
      coaches_members:
        type: structure
        label: Entraîneurs
        fields:
          photo:
            type: files
            label: Photo de profil
            max: 1
            layout: cards
            query: page.images
            width: 1/2
          name:
            type: text
            label: Nom
            width: 1/2
          titles:
            type: textarea
            label: Titres
            help: Un titre par ligne. Ces titres sont affichés sous le nom.
            buttons: false
            width: 1/2
          email:
            type: email
            label: Email
            width: 1/2

  players:
    label: Joueurs remarquables
    icon: star
    fields:
      notable_players:
        type: structure
        label: Joueurs remarquables
        fields:
          name:
            type: text
            label: Nom
            width: 1/3
          achievement:
            type: text
            label: Récompense/Titre
            width: 1/2
          icon:
            type: text
            label: Icône
            width: 1/6
            placeholder: "🥇"
