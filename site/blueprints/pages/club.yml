# Club page blueprint
title: Le Club
icon: 👥

tabs:
  content:
    label: Contenu
    icon: text
    columns:
      - width: 2/3
        sections:
          hero:
            type: fields
            fields:
              hero_title:
                type: text
                label: Titre de la page
                default: "Le Club"
                
              hero_subtitle:
                type: text
                label: Sous-titre
                default: "Découvrez l'équipe du Meyrin CTT."
                
          stats:
            type: fields
            fields:
              stats_headline:
                type: headline
                label: Statistiques du club
                
              stat_members:
                type: number
                label: Nombre de membres
                default: 160
                
              stat_licensed:
                type: number
                label: Joueurs licenciés
                default: 60
                
              stat_min_age:
                type: number
                label: Âge minimum école jeunesse
                default: 6
                
          about:
            type: fields
            fields:
              about_headline:
                type: headline
                label: À propos du club
                
              about_text:
                type: blocks
                label: Présentation du club
                fieldsets:
                  - heading
                  - text
                  - list
                  - quote
                  
      - width: 1/3
        sections:
          files:
            type: files
            label: Images
            layout: cards

  carousel:
    label: Carrousel Photos
    icon: images
    columns:
      - width: 2/3
        sections:
          carousel_settings:
            type: fields
            fields:
              carousel_title:
                type: text
                label: Titre de la section carrousel
                default: "Notre Club en Images"
                
              carousel_subtitle:
                type: textarea
                label: Sous-titre/Description (optionnel)
                maxlength: 200
                
              carousel_autoplay:
                type: toggle
                label: Défilement automatique
                default: true
                help: Active le défilement automatique des images
                
              carousel_delay:
                type: number
                label: Délai de défilement (ms)
                default: 5000
                min: 2000
                max: 10000
                step: 500
                help: Temps d'affichage de chaque image en millisecondes
                
      - width: 1/3
        sections:
          carousel_images:
            type: files
            label: Photos du carrousel
            layout: cards
            template: carousel-image
            help: Ajoutez des photos qui seront affichées dans le carrousel avant l'histoire du club

  history:
    label: Histoire
    icon: clock
    fields:
      history_title:
        type: text
        label: Titre section histoire
        default: "Histoire du Club"
        
      history_timeline:
        type: structure
        label: Chronologie
        fields:
          year:
            type: text
            label: Année/Période
            width: 1/4
          title:
            type: text
            label: Titre
            width: 3/4
          description:
            type: textarea
            label: Description

  committee:
    label: Comité
    icon: users
    fields:
      committee_title:
        type: text
        label: Titre section comité
        default: "Le Comité"
        
      committee_members:
        type: structure
        label: Membres du comité
        fields:
          photo:
            type: files
            label: Photo de profil
            max: 1
            layout: cards
            query: page.images
            width: 1/2
          role:
            type: text
            label: Rôle
            width: 1/2
          name:
            type: text
            label: Nom
            width: 1/2
          email:
            type: email
            label: Email
            width: 1/2

  coaches:
    label: Entraîneurs
    icon: account
    fields:
      coaches_title:
        type: text
        label: Titre section entraîneurs
        default: "Nos Entraîneurs"
        
      coaches_members:
        type: structure
        label: Entraîneurs
        fields:
          photo:
            type: files
            label: Photo de profil
            max: 1
            layout: cards
            query: page.images
            width: 1/2
          specialty:
            type: text
            label: Spécialité
            width: 1/2
          name:
            type: text
            label: Nom
            width: 1/2
          email:
            type: email
            label: Email
            width: 1/2

  players:
    label: Joueurs remarquables
    icon: star
    fields:
      notable_players:
        type: structure
        label: Joueurs remarquables
        fields:
          name:
            type: text
            label: Nom
            width: 1/3
          achievement:
            type: text
            label: Récompense/Titre
            width: 1/2
          icon:
            type: text
            label: Icône
            width: 1/6
            placeholder: "🥇"
