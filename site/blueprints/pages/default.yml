# Default page blueprint
title: Page simple
icon: 📝

status:
  draft: true
  unlisted:
    label: Page cachée
    text: La page n'apparaît pas dans la navigation
  listed:
    label: Page publiée
    text: La page apparaît dans la navigation

columns:
  main:
    width: 2/3
    sections:
      hero:
        type: fields
        fields:
          hero_title:
            type: text
            label: Titre de la page
            
          hero_subtitle:
            type: text
            label: Sous-titre

          hero_image:
            type: files
            label: Image Hero
            max: 1
            layout: cards
            query: page.images
            uploads:
              template: hero
            
      content:
        type: fields
        fields:
          text:
            type: blocks
            label: Contenu
            fieldsets:
              - heading
              - text
              - list
              - quote
              - image
              - gallery
              - video
              
  sidebar:
    width: 1/3
    sections:
      pages:
        type: pages
        label: Sous-pages
        template: default
        
      files:
        type: files
        label: Fichiers
