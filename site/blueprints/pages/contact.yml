# Contact page blueprint
title: Contact
icon: email

tabs:
  content:
    label: Contenu
    icon: text
    columns:
      - width: 1/1
        sections:
          hero:
            type: fields
            fields:
              hero_title:
                type: text
                label: Titre de la page
                default: "Contact"

              hero_image:
                type: files
                label: Image Hero
                max: 1
                layout: cards
                query: page.images
                uploads:
                  template: hero

          info_section:
            type: fields
            fields:
              contact_email:
                type: email
                label: Email de contact
                default: "info@meyrinctt.ch"

              info_title:
                type: text
                label: Titre section coordonnées
                default: "Coordonnées"

              coordinates:
                type: textarea
                label: Coordonnées
                help: Adresse et indications affichées sous le bloc de contact.
                buttons:
                  - headlines
                  - bold
                  - italic
                  - link
                  - email

  map:
    label: Carte
    icon: map
    fields:
      map_headline:
        type: headline
        label: Localisation

      map_url:
        type: url
        label: URL embed Google Maps
        help: Collez uniquement l'URL src de l'iframe Google Maps.
