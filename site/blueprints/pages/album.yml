# Album page blueprint
title: Album
icon: 🖼️

tabs:
  content:
    label: Contenu
    icon: text
    columns:
      - width: 1/2
        fields:
          description:
            type: textarea
            label: Description de l'album
            
          date:
            type: date
            label: Date de l'événement
            
      - width: 1/2
        fields:
          youtube_videos:
            type: structure
            label: Vidéos YouTube
            help: Ajoutez des liens vers des vidéos YouTube
            fields:
              youtube_url:
                type: url
                label: URL YouTube
                placeholder: https://www.youtube.com/watch?v=...
                required: true
              title:
                type: text
                label: Titre
              caption:
                type: text
                label: Légende
        sections:
          cover:
            type: files
            label: Image de couverture
            layout: cards
            max: 1
            template: cover

  media:
    label: Photos & Vidéos
    icon: images
    sections:
      media:
        type: files
        label: Photos & Vidéos (Fichiers)
        layout: cardlets
        templates:
          - photo
          - video
        sortable: true
        image:
          cover: true
